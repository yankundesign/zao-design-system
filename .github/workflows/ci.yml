name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Test tokens (completeness, shared structure, contrast)
        run: pnpm test
      - name: Build docs
        run: pnpm --filter @zao/docs build
      - name: Typecheck
        run: pnpm typecheck
      - name: Check formatting
        run: pnpm format:check
