name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything except the docs browser tests runs once.
  packages:
    name: Packages, docs export, types and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Test packages
        run: pnpm -r --filter '!@zao/docs' run test
      - name: Build docs
        run: pnpm docs:build
      - name: Typecheck
        run: pnpm typecheck
      - name: Check formatting
        run: pnpm format:check

  # The docs browser suite, split by spec file. Each shard builds its own
  # production docs and runs its files on one worker, as the full suite did.
  docs-browser:
    name: Docs browser tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Install component test browser
        run: pnpm --filter @zao/docs exec playwright install --with-deps chromium
      - name: Build docs for browser tests
        run: pnpm --filter @zao/docs build
      - name: Test components
        run: pnpm --filter @zao/docs exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # The single required status: passes only when every job above passed.
  check:
    if: ${{ !cancelled() }}
    needs: [packages, docs-browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        run: |
          echo "Packages, docs export, types and format: ${{ needs.packages.result }}"
          echo "Docs browser tests: ${{ needs.docs-browser.result }}"
          test "${{ needs.packages.result }}" = success
          test "${{ needs.docs-browser.result }}" = success
